# API Gateway: porta de entrada do front-end, exposta em http://localhost:8080. 2 réplicas para alta disponibilidade.
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  type: LoadBalancer
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: gateway-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # zero downtime: sobe o novo pod antes de derrubar o antigo
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 45
      # só inicia depois que as dependências aceitam conexões (evita crash-loop na subida)
      initContainers:
        - name: wait-dependencies
          image: busybox:1.36
          command: ["sh", "-c", 'until nc -z server-service 8761; do echo "aguardando server-service:8761"; sleep 2; done']
      containers:
        - name: gateway-service
          image: ghcr.io/acadl-dev/gateway-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: finora-config
          # Probes do Spring Boot Actuator
          startupProbe:          # até ~3 min para a JVM subir
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:        # só recebe tráfego quando está pronto
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:         # reiniciado automaticamente se travar
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 4
          lifecycle:
            preStop:             # dá tempo do Eureka/Service pararem de enviar tráfego
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
