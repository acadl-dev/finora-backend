# "Produção simulada" no Kubernetes do Docker Desktop:
#   kubectl apply -k deploy/k8s/overlays/local
# Sobe tudo: dados, microsserviços, front-end e observabilidade.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finora
resources:
  - ../../base
  - ../../observability
  - ../../frontend
# Segredos lidos de secrets.env (NÃO versionado; copie de secrets.env.example)
secretGenerator:
  - name: finora-secrets
    envs:
      - secrets.env
generatorOptions:
  disableNameSuffixHash: true
