server:
  port: 8083

spring:
  application:
    name: reports-service
  # Lê o .env (JWT_SECRET) seja qual for a pasta de execução: a do serviço,
  # de back_finora (IntelliJ aberto na raiz) ou da pasta do projeto
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./reports-service/.env[.properties]
      - optional:file:./back_finora/reports-service/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5434/finora_reports
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  # RabbitMQ (docker-compose.yml na raiz de back_finora)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:finora}
    password: ${RABBITMQ_PASSWORD:finora}
    listener:
      simple:
        acknowledge-mode: auto          # ack automático quando o listener termina sem erro
        prefetch: 10                    # no máximo 10 mensagens "em voo" por consumidor
        default-requeue-rejected: false # esgotadas as tentativas -> vai para a DLQ (não volta pra fila)
        retry:
          enabled: true                 # retry com backoff exponencial antes de desistir
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 10s

# Mesmo segredo usado pelo finora para assinar o JWT (lido do .env)
jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # ambiente local: todos os serviços rodam na mesma máquina
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

reports:
  dispatcher:
    interval-ms: 30000        # reenvia comandos de relatórios parados em REQUESTED
    stale-after-seconds: 20
    timeout-minutes: 10       # depois disso o relatório é marcado como FAILED
