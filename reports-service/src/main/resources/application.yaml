server:
  port: 8083
  shutdown: graceful   # termina as requisições em andamento antes de parar (rolling update)

spring:
  application:
    name: reports-service
  # Lê o .env (JWT_SECRET) seja qual for a pasta de execução: a do serviço,
  # de back_finora (IntelliJ aberto na raiz) ou da pasta do projeto
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./reports-service/.env[.properties]
      - optional:file:./back_finora/reports-service/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5434/finora_reports
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${JPA_SHOW_SQL:true}
  # RabbitMQ (docker-compose.yml na raiz de back_finora)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:finora}
    password: ${RABBITMQ_PASSWORD:finora}
    template:
      observation-enabled: true         # propaga o traceId no comando de geração de relatório
    listener:
      simple:
        acknowledge-mode: auto          # ack automático quando o listener termina sem erro
        observation-enabled: true       # continua o trace recebido nos headers da mensagem
        prefetch: 10                    # no máximo 10 mensagens "em voo" por consumidor
        default-requeue-rejected: false # esgotadas as tentativas -> vai para a DLQ (não volta pra fila)
        retry:
          enabled: true                 # retry com backoff exponencial antes de desistir
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 10s

# Mesmo segredo usado pelo finora para assinar o JWT (lido do .env)
jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # ambiente local: todos os serviços rodam na mesma máquina
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    # no Kubernetes cada pod se registra pelo próprio IP (EUREKA_PREFER_IP=true)
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

reports:
  dispatcher:
    interval-ms: 30000        # reenvia comandos de relatórios parados em REQUESTED
    stale-after-seconds: 20
    timeout-minutes: 10       # depois disso o relatório é marcado como FAILED

# ===== Operação em produção (TP5): health checks, métricas e rastreamento =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness e /readiness (Kubernetes)
      show-details: always
      group:
        readiness:
          # pod só recebe tráfego se o banco estiver acessível; RabbitMQ fora do ar NÃO tira
          # o serviço do ar (a outbox/retry cuidam disso) — resiliência da etapa anterior
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}   # rótulo usado nos painéis do Grafana
    distribution:
      percentiles-histogram:
        http.server.requests: true               # permite calcular p95/p99 no Prometheus
  tracing:
    sampling:
      # 1.0 = 100% das requisições rastreadas (ConfigMap do Kubernetes / compose de produção).
      # Padrão 0.0 no desenvolvimento local: sem Tempo rodando, não há para onde exportar.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}   # Grafana Tempo

# Destino dos logs quando o profile "loki" está ativo (ver logback-spring.xml)
logging:
  loki:
    url: ${LOKI_URL:http://localhost:3100}
